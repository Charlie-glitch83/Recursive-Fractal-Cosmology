name: RFCU1 unpack Module A and B

on:
  push:
    branches:
      - agent/rfcu1-work-iteration-recovery
    paths:
      - RFCU1/98_TRANSFER_ARCHIVES/work_iteration/rfcu1_A_B_001_010/MANIFEST.txt

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rfcu1-work-iteration-recovery
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          stage='RFCU1/98_TRANSFER_ARCHIVES/work_iteration/rfcu1_A_B_001_010'
          cat "$stage"/part*.b64 > /tmp/rfcu1_A_B_001_010.tar.xz.b64
          base64 -d /tmp/rfcu1_A_B_001_010.tar.xz.b64 > /tmp/rfcu1_A_B_001_010.tar.xz
          echo 'a12d82611d8634446aa58ff7a6ec15c8dc49780a076df8ffc6f9d20c86627c1b  /tmp/rfcu1_A_B_001_010.tar.xz' | sha256sum -c -

      - name: Extract canonical source trees
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/rfcu1_A_B_001_010.tar.xz -C .
          find RFCU1 -type d -name __pycache__ -prune -exec rm -rf {} +
          test "$(find RFCU1/deliverables RFCU1/execution -type f | wc -l)" -ge 86

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RFCU1/deliverables RFCU1/execution
          if git diff --cached --quiet; then
            echo 'No extracted-file changes required.'
            exit 0
          fi
          git commit -m 'RFCU1: unpack Module A and Module B RUNs 008-010'
          git push origin HEAD:agent/rfcu1-work-iteration-recovery
